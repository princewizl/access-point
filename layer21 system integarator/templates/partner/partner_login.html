<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Sign In - Layer21</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face { font-family: 'Aptos'; src: local('Aptos'), local('Segoe UI'), sans-serif; }
        body { font-family: 'Aptos', 'Segoe UI', system-ui, sans-serif; }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glow-input:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2), 0 0 10px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#0b1120] min-h-screen flex items-center justify-center relative overflow-hidden text-slate-200">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-sky-600/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md px-6 animate-entry relative z-10">
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-3 rounded bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="glass-card rounded-2xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Layer21 Partners</h1>
                <p class="text-slate-400 text-sm mt-2">Secure access to the CRM & Support Node</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
                <input type="hidden" name="portal_type" value="partner"> 

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Username</label>
                    <input type="text" name="username" required 
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none glow-input transition-all duration-200"
                        placeholder="partner.id">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide">Password</label>
                    </div>
                    <input type="password" name="password" required 
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none glow-input transition-all duration-200"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox" class="h-4 w-4 rounded border-slate-700 bg-slate-900 text-sky-500 focus:ring-sky-500 focus:ring-offset-slate-900">
                    <label for="remember" class="ml-2 block text-sm text-slate-400">Keep me securely logged in</label>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-300 shadow-[0_0_15px_rgba(56,189,248,0.4)] hover:shadow-[0_0_25px_rgba(56,189,248,0.6)] transform hover:-translate-y-0.5 mt-4">
                    Initialize Session
                </button>
            </form>
        </div>
    </div>
</body>
</html>
